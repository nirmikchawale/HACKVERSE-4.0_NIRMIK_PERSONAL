name: B-01 Frontend Certification

on:
  push:
    branches:
      - feat/unlockplan-app-deploy
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript, audit, build and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned frontend dependencies
        run: npm install
      - name: Foundation unit tests
        run: npm test
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser smoke
        run: npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b01-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
