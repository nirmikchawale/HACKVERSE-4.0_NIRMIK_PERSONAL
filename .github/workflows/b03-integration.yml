name: B-03 Real FastAPI + Browser Integration

on:
  push:
    branches: [feat/unlockplan-app-deploy]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/b03-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/b03-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-integration:
    name: Backend tests + real six-route/browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Verify exact backend source manifest
        working-directory: backend
        run: sha256sum -c MANIFEST.sha256
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: All Python source/contract tests
        working-directory: backend
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Check dependency security
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build Vite/TypeScript
        working-directory: frontend
        run: npm run build
      - name: Start genuine FastAPI
        run: |
          set -euo pipefail
          (cd backend && python -m uvicorn unlockplan.api:app --host 127.0.0.1 --port 8000 > /tmp/unlockplan-b03-uvicorn.log 2>&1) &
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'FastAPI did not pass local health check.'
          cat /tmp/unlockplan-b03-uvicorn.log
          exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real six-route and browser end-to-end tests
        working-directory: frontend
        env:
          B03_INTEGRATION: 'true'
        run: npm run test:browser -- tests/browser/b03-real-api.spec.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b03-real-api-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
