name: CF-OV-KPI-01 Live Cloudflare Visual Certificate

on:
  pull_request:
    paths:
      - '.github/workflows/cf-ov-kpi-live-visual-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-kpi:
    name: Exact deployed SHA plus live KPI baseline at desktop and mobile widths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EDGE_URL: https://agri-foresight.nirmikchawale1.workers.dev
      FEATURE_MERGE_SHA: b25e0f6be83bbf593f9091ad3e6a4fd1773f7965
    steps:
      - name: Checkout read-only audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Wait boundedly for Cloudflare production to include merged alignment fix
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const origin=process.env.EDGE_URL;
          const base=process.env.FEATURE_MERGE_SHA;
          const repo='nirmikchawale/HACKVERSE-4.0_NIRMIK_PERSONAL';
          const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let certified=null;
          for(let attempt=1;attempt<=48;attempt++){
            try{
              const cache='?audit='+Date.now();
              const [receiptResult,cssResult]=await Promise.all([
                fetch(origin+'/_release.json'+cache,{signal:AbortSignal.timeout(16000)}),
                fetch(origin+'/overview-layout.css'+cache,{signal:AbortSignal.timeout(16000)})
              ]);
              if(!receiptResult.ok||!cssResult.ok)throw Error('Public manifest/CSS non-200');
              const receipt=await receiptResult.json(),css=await cssResult.text(),sha=receipt.git_commit_sha||'';
              const patchPresent=css.includes('CF-OV-KPI-02')&&css.includes('grid-template-rows:subgrid')&&css.includes('margin-top:0;');
              console.log('PUBLIC_KPI_POLL',attempt,sha,'alignedCSS='+patchPresent);
              if(patchPresent&&/^[a-f0-9]{40}$/.test(sha)){
                const response=await fetch('https://api.github.com/repos/'+repo+'/compare/'+base+'...'+sha,{
                  headers:{Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)
                });
                if(!response.ok)throw Error('Cannot establish GitHub source ancestry HTTP '+response.status);
                const relation=(await response.json()).status;
                if(relation==='identical'||relation==='ahead'){
                  certified=sha;break;
                }
              }
            }catch(error){console.log('PUBLIC_KPI_POLL_ERROR',attempt,String(error.message).slice(0,160));}
            await pause(10_000);
          }
          if(!certified)throw Error('Cloudflare does not yet serve a release descended from the merged alignment commit with the new CSS');
          appendFileSync(process.env.GITHUB_ENV,'PUBLIC_RELEASE_SHA='+certified+'\n');
          console.log('PUBLIC_KPI_SOURCE_PASS',certified,'FEATURE_MERGE_SHA',base);
          JS
      - name: Install pinned frontend test tools
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify exact live card positions in real Chromium without API mocks
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          const origin=process.env.EDGE_URL,release=process.env.PUBLIC_RELEASE_SHA;
          const assert=(condition,message)=>{if(!condition)throw Error('PUBLIC_KPI_ALIGNMENT_FAIL: '+message);};
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [1545,1440,1024,390]){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage(),errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.addInitScript(()=>localStorage.clear());
              const response=await page.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:30000});
              assert(response?.status()===200,'Live root must return HTTP 200');
              await page.locator('section[data-page="0"] .kpis > .kpi').first().waitFor({state:'visible',timeout:20000});
              await page.waitForTimeout(600);
              const metrics=await page.locator('section[data-page="0"] .kpis > .kpi').evaluateAll(cards=>
                cards.map(card=>{
                  const value=card.querySelector('.kpi-value'),note=card.querySelector('.kpi-sub');
                  return {
                    valueY:value.getBoundingClientRect().y,
                    noteY:note.getBoundingClientRect().y,
                    valueHeight:value.getBoundingClientRect().height,
                    marginTop:getComputedStyle(value).marginTop,
                    value:value.textContent?.trim()
                  };
                }));
              assert(metrics.length===4,'All four Overview KPI cards are required');
              assert(metrics.every(c=>c.marginTop==='0px'),'Legacy auto top margin still applied');
              const groups=width<=1050?[metrics.slice(0,2),metrics.slice(2,4)]:[metrics];
              assert(groups.every(g=>g.every(c=>Math.abs(c.valueY-g[0].valueY)<=2)),
                'Metric values not aligned at '+width+'px; '+JSON.stringify(metrics));
              if(width>=1440){
                const noteY=metrics[0].noteY;
                assert(metrics.every(c=>Math.abs(c.noteY-noteY)<=2),
                  'Farm Resources caption still lower at '+width+'px; '+JSON.stringify(metrics));
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
              assert(!overflow,'Horizontal page overflow at '+width+'px');
              assert(errors.length===0,'JavaScript page errors: '+errors.slice(0,2).join('; '));
              console.log('PUBLIC_KPI_ALIGNMENT_PASS',width,'sha='+release,
                'farmValueY='+metrics[2].valueY,'farmCaptionY='+metrics[2].noteY);
              await context.close();
            }
          }finally{await browser.close();}
          JS
