name: CF-RES-03 real public Worker API smoke (read-only audit)

on:
  pull_request:
    paths:
      - '.github/workflows/cf-res03-real-api-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-api:
    name: Public FastAPI, 100-case and source-contract smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EDGE_URL: https://agri-foresight.nirmikchawale1.workers.dev
    steps:
      - name: Checkout approved stateless API contract test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Resolve published SHA and validate Farm Resources ancestry
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const base='283af29305877a502c24391b519d08921b35b61d';
          const origin=process.env.EDGE_URL;
          const response=await fetch(origin+'/_release.json',{signal:AbortSignal.timeout(20000)});
          if(!response.ok)throw Error('Public release manifest missing');
          const data=await response.json();
          const published=data.git_commit_sha;
          if(!/^[a-f0-9]{40}$/.test(published||''))throw Error('Invalid deployed SHA');
          const check=await fetch('https://api.github.com/repos/nirmikchawale/HACKVERSE-4.0_NIRMIK_PERSONAL/compare/'+base+'...'+published,{signal:AbortSignal.timeout(20000)});
          if(!check.ok||!['identical','ahead'].includes((await check.json()).status))
            throw Error('Public Worker is not descended from merged Farm Resources feature');
          const fs=await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_ENV,'EXPECTED_SHA='+published+'\n');
          console.log('PUBLIC_API_AUDIT_SOURCE_SHA',published);
          JS
      - name: Validate real public Python Worker APIs with isolated fixtures
        env:
          REQUIRE_LIVE_CLIMATE: '0'
        shell: bash
        run: node backend/scripts/cloudflare-smoke.mjs
