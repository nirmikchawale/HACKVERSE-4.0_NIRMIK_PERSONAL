name: HOME-01 Source-aware Overview Certification

on:
  push:
    branches:
      - feature/homepage-source-readiness-20261101
  pull_request:
    branches:
      - migration/cloudflare-typography-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: HOME-01 frontend build + complete Chromium suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Unit tests and production security audit
        run: |
          npm test
          npm audit --audit-level=high
      - name: TypeScript and production Vite build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full responsive, forecast, resource and overview suite
        run: npm run test:browser

  api:
    name: HOME-01 Python tests + genuine FastAPI browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Validate backend manifest
        working-directory: backend
        run: sha256sum -c MANIFEST.sha256
      - name: Install Python and test backend
        run: |
          python -m pip install -r backend/requirements.txt
          (cd backend && python -m pytest -q)
      - name: Build real frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Start real FastAPI and smoke /api/health
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && python -m uvicorn unlockplan.api:app --host 127.0.0.1 --port 8000 > /tmp/home01-api.log 2>&1) &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/home01-api.log
          exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser verification against genuine API
        working-directory: frontend
        env:
          B03_INTEGRATION: 'true'
        run: npx playwright test tests/browser/b03-real-api.spec.mjs
