name: UnlockPlan A05-B02 Integration CI
on:
  push:
    branches: [integration/unlockplan-a05-b02]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/contracts/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Verify backend manifest and 95+ regression tests
        run: |
          cd backend
          sha256sum -c MANIFEST.sha256
          cd ..
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt
          cd backend
          ../.venv/bin/python -m pytest -q
          cd ..
          node --check backend/static/app.js
      - name: Frontend baseline tests, typecheck and Vite build
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start real FastAPI server
        run: |
          (cd backend && ../.venv/bin/python -m uvicorn unlockplan.api:app --host 127.0.0.1 --port 8000) > /tmp/unlockplan-api.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/unlockplan-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8000/api/health
      - name: Desktop/mobile browser and six live FastAPI routes
        working-directory: frontend
        run: npm run test:browser
      - name: Show backend logs if tests fail
        if: failure()
        run: tail -120 /tmp/unlockplan-api.log || true
