name: UnlockPlan authentic weather verification

on:
  push:
    branches: [feat/unlockplan-core]
    paths:
      - 'backend/unlockplan/weather.py'
      - 'backend/scripts/verify_live.py'
      - 'backend/tests/test_weather*'
      - '.github/workflows/live-weather-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weather-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch authentic weather via public Open-Meteo API
        run: |
          cd backend
          python3 -m scripts.verify_live
        env:
          UNLOCKPLAN_WEATHER_EVIDENCE_DIR: weather-evidence
      - name: Retain source response and metadata for verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-meteo-a03-${{ github.sha }}
          path: backend/weather-evidence/
          if-no-files-found: warn
          retention-days: 7
