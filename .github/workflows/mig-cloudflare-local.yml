name: MIG-Cloudflare Local Python Worker Certification
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/mig-cloudflare-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-local:
    name: Cloudflare Python Worker local API + asset smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.13 for Cloudflare Pyodide target
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Build actual frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install official Python Worker CLI runner
        run: python -m pip install 'uv>=0.8,<1'
      - name: Start real Cloudflare Python Worker locally
        shell: bash
        run: |
          set -euo pipefail
          (
            cd backend
            uv run pywrangler dev --ip 127.0.0.1 --port 8787
          ) > /tmp/agri-cloudflare-pywrangler.log 2>&1 &
          echo $! > /tmp/agri-cloudflare-worker.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8787/api/health >/dev/null; then
              echo 'Real Cloudflare Worker health is reachable'
              exit 0
            fi
            sleep 1
          done
          echo 'Cloudflare Worker local startup failed'
          tail -n 130 /tmp/agri-cloudflare-pywrangler.log
          exit 1
      - name: Verify actual same-origin Python APIs and Vite assets
        run: node backend/scripts/cloudflare-smoke.mjs
      - name: Preserve startup errors only (no credentials)
        if: failure()
        run: |
          if test -f /tmp/agri-cloudflare-pywrangler.log; then
            tail -n 80 /tmp/agri-cloudflare-pywrangler.log
          fi
