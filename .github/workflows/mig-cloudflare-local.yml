name: MIG-Cloudflare Local Python Worker Certification
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'wrangler.jsonc'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pylock.toml'
      - 'scripts/prepare-cloudflare-release.mjs'
      - '.github/workflows/mig-cloudflare-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-local:
    name: Cloudflare Python Worker local API + asset smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.13 for Cloudflare Pyodide target
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Build actual frontend assets
        working-directory: frontend
        run: |
          npm install
          node ../scripts/prepare-cloudflare-release.mjs
          npm run build
      - name: Check Cloudflare repository package builds without auto-discovery
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/agri-cloudflare-root-wheel .
          python - <<'PY'
          import glob,zipfile
          paths=glob.glob('/tmp/agri-cloudflare-root-wheel/*.whl')
          assert len(paths)==1, f'Expected one candidate wheel; got {paths}'
          with zipfile.ZipFile(paths[0]) as wheel:
              names=wheel.namelist()
          assert 'backend/unlockplan/edge.py' in names, 'Cloudflare API code not packaged'
          assert not any(s.startswith(('frontend/','contrib/','backend/tests/')) for s in names), 'Non-Python packages leaked into wheel'
          print('Cloudflare Python root wheel packaging PASS')
          PY
      - name: Install official Python Worker CLI runner
        run: python -m pip install 'uv>=0.8,<1'
      - name: Assemble Python SDK and Worker bundle without publishing
        shell: bash
        run: |
          set -euo pipefail
          uv run --with packaging python - <<'PY'
          import importlib.metadata as md
          from packaging.version import Version
          cli=md.version("workers-py")
          sdk=md.version("workers-runtime-sdk")
          assert Version(cli)>=Version("1.17.9"), f"Outdated Cloudflare CLI: {cli}"
          assert Version(sdk)>=Version("1.9.5"), f"Outdated Cloudflare runtime SDK: {sdk}"
          print("Cloudflare pywrangler and SDK versions PASS:", cli, sdk)
          PY
          uv run pywrangler deploy --dry-run --outdir /tmp/agri-foresight-bundle
          node scripts/assert-cloudflare-sdk.mjs
          python - <<'PYCODE'
          from pathlib import Path
          bundle=Path('/tmp/agri-foresight-bundle')
          paths=[p.relative_to(bundle).as_posix() for p in bundle.rglob('*') if p.is_file()]
          assert 'worker.py' in paths
          assert any(p.endswith('unlockplan/edge.py') for p in paths)
          assert not any(p.startswith(('frontend/', '.venv/', '.venv-workers/')) for p in paths)
          print('Worker application boundary PASS; no frontend tooling or host environments bundled')
          PYCODE
      - name: Start real Cloudflare Python Worker locally
        shell: bash
        run: |
          set -euo pipefail
          (
            uv run pywrangler dev --ip 127.0.0.1 --port 8787
          ) > /tmp/agri-cloudflare-pywrangler.log 2>&1 &
          echo $! > /tmp/agri-cloudflare-worker.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8787/api/health >/dev/null; then
              echo 'Real Cloudflare Worker health is reachable'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/agri-cloudflare-worker.pid)" 2>/dev/null; then
              echo 'Cloudflare Worker exited before health became reachable'
              tail -n 85 /tmp/agri-cloudflare-pywrangler.log
              exit 1
            fi
            sleep 1
          done
          echo 'Cloudflare Worker local startup failed'
          tail -n 130 /tmp/agri-cloudflare-pywrangler.log
          exit 1
      - name: Verify actual same-origin Python APIs and Vite assets
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node backend/scripts/cloudflare-smoke.mjs
      - name: Preserve startup errors only (no credentials)
        if: failure()
        run: |
          if test -f /tmp/agri-cloudflare-pywrangler.log; then
            tail -n 80 /tmp/agri-cloudflare-pywrangler.log
          fi
