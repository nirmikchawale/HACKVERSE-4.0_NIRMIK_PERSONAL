[project]
name = "agri-foresight-cloudflare"
version = "0.2.0"
description = "Agri Foresight's full-stack, same-origin Cloudflare Worker"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "tzdata>=2024.1"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

# Cloudflare Builders install this repository from pyproject.toml. Restrict
# setuptools discovery to the Python application; frontend/ and contrib/
# are NOT distributable Python packages.
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend", "backend.unlockplan", "backend.unlockplan.*"]
exclude = ["backend.tests", "backend.tests.*"]
namespaces = true
